# Tests the iPhone app, then sends it to TestFlight: on every push to main
# that changes the iPhone app, or by hand from the Actions tab ("Run
# workflow"). ADR 0022 lists the secrets and the variable it reads, and how to
# make them.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "third_party/whisper.cpp"
      - ".github/workflows/testflight.yml"

# One run at a time; a newer push replaces a run that has not finished.
concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    # Apple silicon, which the whisper.cpp build and the simulator tests need.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Tools
        run: |
          xcodebuild -version
          command -v ninja || brew install ninja

      - name: Test
        run: |
          make model-download
          # The newest iPhone Pro simulator this runner has.
          sim=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+ Pro' | sort -V | tail -1)
          make ios-test IOS_SIM="${sim:?no iPhone Pro simulator on this runner}"

      - name: Signing
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          : "${IOS_DIST_CERT_P12:?add the repository secrets first, as ADR 0022 describes}"
          echo -n "$IOS_DIST_CERT_P12" | base64 --decode -o "$RUNNER_TEMP/distribution.p12"
          echo -n "$IOS_PROFILE" | base64 --decode -o "$RUNNER_TEMP/app-store.mobileprovision"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

          # A keychain of its own for this run, holding only the certificate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain"

      - name: Archive and upload
        env:
          PROFILE_PATH: ${{ runner.temp }}/app-store.mobileprovision
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: make ios-testflight

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app-store.mobileprovision" "$RUNNER_TEMP/AuthKey.p8"
